      <path d="M13 15 L16 11 L15 14 L18 14 L14 19 L15 15 Z" fill="#10b981" />
      <text x="26" y="18" class="font-mono" font-size="11.5" fill="#a7f3d0">Supabase</text>
    </g>

    <!-- Firebase -->
    <g transform="translate(214, 0)">
      <rect width="92" height="28" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.3" />
      <text x="14" y="18" class="font-mono" font-size="11.5" fill="#fcd34d">Firebase</text>
