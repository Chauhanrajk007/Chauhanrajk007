      <path d="M14 11 L15 14 L18 15 L15 16 L14 19 L13 16 L10 15 L13 14 Z" fill="#c084fc" />
      <text x="25" y="19" class="font-mono" font-size="12" fill="#f3e8ff" font-weight="600">RAG · LLMs</text>
    </g>

    <!-- React -->
    <g transform="translate(450, 0)">
      <rect width="88" height="30" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.35" />
      <circle cx="15" cy="15" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <text x="28" y="19" class="font-mono" font-size="12" fill="#7dd3fc">React</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(546, 0)">
      <rect width="96" height="30" rx="8" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.35" />
      <polygon points="15,11 19,13 19,17 15,19 11,17 11,13" fill="none" stroke="#4ade80" stroke-width="1.2" />
      <text x="27" y="19" class="font-mono" font-size="12" fill="#86efac">Node.js</text>
    </g>

    <!-- Express -->
    <g transform="translate(650, 0)">
      <rect width="88" height="30" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="14" y="19" class="font-mono" font-size="12" fill="#e2e8f0">Express</text>
    </g>

    <!-- Tailwind -->
    <g transform="translate(746, 0)">
      <rect width="92" height="30" rx="8" fill="#0f172a" stroke="#0891b2" stroke-opacity="0.35" />
      <text x="14" y="19" class="font-mono" font-size="12" fill="#67e8f9">Tailwind</text>
    </g>
  </g>

  <!-- Row 2: Databases & Tools -->
