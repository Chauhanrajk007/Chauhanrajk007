<svg viewBox="0 0 880 420" width="880" height="420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Top Border Light Shimmer -->
    <linearGradient id="topHighlight" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Name Animated Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#c084fc;#f472b6;#67e8f9" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#f43f5e;#a78bfa" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#67e8f9;#a78bfa;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <radialGradient id="neonGlowLeft" cx="180" cy="120" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="neonGlowRight" cx="720" cy="200" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Icon Gradients -->
    <linearGradient id="reactGrad" x1="0" y1="0" x2="10" y2="10"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="10" y2="10"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="pyGrad" x1="0" y1="0" x2="10" y2="10"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="10" y2="10"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#ec4899"/></linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.2); opacity: 0.4; } }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }

    .cursor-blink { animation: blink 1.1s infinite steps(1); }
    .status-pulse { animation: pulseGlow 2.2s infinite ease-in-out; transform-origin: center; }
  </style>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="880" height="420" rx="18" fill="url(#bg)" />
  <rect width="880" height="420" rx="18" fill="url(#dotPattern)" />
  <rect width="880" height="420" rx="18" fill="url(#neonGlowLeft)" />
  <rect width="880" height="420" rx="18" fill="url(#neonGlowRight)" />

  <!-- Outer Glass Border & Top Prism Line -->
  <rect x="0.5" y="0.5" width="879" height="419" rx="17.5" stroke="#ffffff" stroke-opacity="0.07" />
  <line x1="120" y1="1" x2="760" y2="1" stroke="url(#topHighlight)" stroke-width="2" />

  <!-- ================= TOP NAVIGATION HUD ================= -->
  <!-- Terminal Prompt -->
  <g transform="translate(32, 28)">
    <rect width="210" height="28" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    <circle cx="14" cy="14" r="3.5" fill="#f43f5e" />
    <circle cx="26" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="38" cy="14" r="3.5" fill="#10b981" />
    <text x="52" y="18" class="font-mono" font-size="11.5" fill="#94a3b8" letter-spacing="0.5">raj@bengaluru:~</text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(620, 28)">
    <rect width="228" height="28" rx="14" fill="#022c22" fill-opacity="0.6" stroke="#059669" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="7" fill="#34d399" fill-opacity="0.25" class="status-pulse" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="29" y="18" class="font-mono" font-size="11" fill="#a7f3d0" font-weight="600">Available for Opportunities</text>
  </g>

  <!-- ================= LEFT HERO: IDENTITY ================= -->
  <g transform="translate(32, 85)">
    <!-- Eyebrow Tag -->
    <rect x="0" y="0" width="138" height="22" rx="11" fill="#4f46e5" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3" />
    <text x="69" y="15" text-anchor="middle" class="font-mono" font-size="10.5" fill="#a5b4fc" font-weight="600" letter-spacing="1">FULL-STACK &amp; AI</text>

    <!-- Name Headline -->
    <text x="0" y="58" class="font-sans" font-size="46" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.2">
      Chauhan Raj K
    </text>

    <!-- Dynamic Terminal Subtitle -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="font-mono" font-size="15" fill="#e2e8f0" font-weight="500">
        <tspan fill="#a855f7">❯</tspan> Building intelligent software &amp; scalable web
      </text>
      <!-- Blinking Cursor -->
      <rect x="424" y="-13" width="7" height="16" fill="#38bdf8" class="cursor-blink" rx="1"/>
    </g>

    <!-- Education / Location Chips -->
    <g transform="translate(0, 114)">
      <text class="font-mono" font-size="12" fill="#94a3b8">
        🎓 <tspan fill="#cbd5e1">CSE (IoT) · Presidency University</tspan>  
        <tspan fill="#475569" dx="10">|</tspan>  
        <tspan dx="10">📍</tspan> <tspan fill="#cbd5e1">Bengaluru, IN</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT BENTO CARDS ================= -->
  <!-- Bento Card 1: DSA & Problem Solving -->
  <g transform="translate(528, 85)">
    <rect width="320" height="66" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" />
    <!-- Mini Icon -->
    <circle cx="34" cy="33" r="16" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.25" />
    <text x="34" y="38" text-anchor="middle" font-size="14">⚡</text>

    <text x="62" y="27" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PROBLEM SOLVING</text>
    <text x="62" y="47" class="font-sans" font-size="14.5" font-weight="700" fill="#f8fafc">
      90+ DSA <tspan font-weight="400" fill="#64748b" font-size="12.5">(C++ &amp; Java)</tspan>
    </text>
  </g>

  <!-- Bento Card 2: AI / Hackathons -->
  <g transform="translate(528, 161)">
    <rect width="320" height="66" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" />
    <!-- Mini Icon -->
    <circle cx="34" cy="33" r="16" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-opacity="0.25" />
    <text x="34" y="38" text-anchor="middle" font-size="14">🏆</text>

    <text x="62" y="27" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">COMPETITIVE</text>
    <text x="62" y="47" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">
      2x Hackathon Finalist <tspan font-weight="500" fill="#c084fc" font-size="12">(3rd Place)</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM SECTION: TECH ARSENAL ================= -->
  <!-- Section Divider -->
  <line x1="32" y1="245" x2="848" y2="245" stroke="#ffffff" stroke-opacity="0.06" />

  <!-- Arsenal Title -->
  <text x="32" y="274" class="font-mono" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">STACK &amp; TECHNOLOGIES</text>

  <!-- Interactive-Style Tech Badges with Micro-Icons -->
  <g transform="translate(32, 290)">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect width="90" height="30" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.35" />
      <circle cx="16" cy="15" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <text x="30" y="19" class="font-mono" font-size="12" fill="#7dd3fc" font-weight="500">React</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(98, 0)">
      <rect width="98" height="30" rx="8" fill="#0f172a" stroke="#16a34a" stroke-opacity="0.35" />
      <polygon points="16,11 20,13 20,17 16,19 12,17 12,13" fill="none" stroke="#4ade80" stroke-width="1.2" />
      <text x="28" y="19" class="font-mono" font-size="12" fill="#86efac" font-weight="500">Node.js</text>
    </g>

    <!-- Express -->
    <g transform="translate(204, 0)">
      <rect width="94" height="30" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="14" y="19" class="font-mono" font-size="12" fill="#e2e8f0">Express</text>
    </g>

    <!-- Tailwind -->
    <g transform="translate(306, 0)">
      <rect width="98" height="30" rx="8" fill="#0f172a" stroke="#0891b2" stroke-opacity="0.35" />
      <path d="M12 15 C13 13, 15 13, 16 14 C17 15, 18 15, 19 14" stroke="#22d3ee" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="27" y="19" class="font-mono" font-size="12" fill="#67e8f9">Tailwind</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(412, 0)">
      <rect width="102" height="30" rx="8" fill="#0f172a" stroke="#059669" stroke-opacity="0.35" />
      <path d="M16 10 C14 13, 14 16, 16 19 C18 16, 18 13, 16 10 Z" fill="#34d399" />
      <text x="28" y="19" class="font-mono" font-size="12" fill="#6ee7b7">MongoDB</text>
    </g>

    <!-- Supabase -->
    <g transform="translate(522, 0)">
      <rect width="104" height="30" rx="8" fill="#0f172a" stroke="#059669" stroke-opacity="0.35" />
      <path d="M13 16 L17 11 L16 15 L19 15 L15 20 L16 16 Z" fill="#10b981" />
      <text x="27" y="19" class="font-mono" font-size="12" fill="#a7f3d0">Supabase</text>
    </g>

    <!-- RAG / AI -->
    <g transform="translate(634, 0)">
      <rect width="112" height="30" rx="8" fill="#2e1065" fill-opacity="0.4" stroke="#9333ea" stroke-opacity="0.4" />
      <path d="M15 11 L16 14 L19 15 L16 16 L15 19 L14 16 L11 15 L14 14 Z" fill="#c084fc" />
      <text x="27" y="19" class="font-mono" font-size="12" fill="#e9d5ff" font-weight="600">RAG · LLMs</text>
    </g>

    <!-- Python -->
    <g transform="translate(754, 0)">
      <rect width="94" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" />
      <circle cx="16" cy="13" r="1.5" fill="#38bdf8" />
      <circle cx="20" cy="17" r="1.5" fill="#facc15" />
      <text x="29" y="19" class="font-mono" font-size="12" fill="#bae6fd">Python</text>
    </g>
  </g>

  <!-- ================= FOOTER / PROFILE LINKS ================= -->
  <g transform="translate(32, 360)">
    <rect width="816" height="38" rx="9" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />

    <!-- Portfolio Link -->
    <g transform="translate(20, 11)">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <line x1="2" y1="8" x2="14" y2="8" stroke="#38bdf8" stroke-width="1" />
      <text x="22" y="12" class="font-mono" font-size="11.5" fill="#94a3b8">
        Portfolio: <tspan fill="#38bdf8" font-weight="500">chauhanrajk007.github.io/raj-portfolio</tspan>
      </text>
    </g>

    <!-- LinkedIn Link -->
    <g transform="translate(560, 11)">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="#818cf8" stroke-width="1.2" />
      <text x="6" y="11" class="font-sans" font-size="9" font-weight="bold" fill="#818cf8">in</text>
      <text x="22" y="12" class="font-mono" font-size="11.5" fill="#94a3b8">
        LinkedIn: <tspan fill="#a5b4fc" font-weight="500">/in/chauhan-raj-k</tspan>
      </text>
    </g>
  </g>
</svg>
