    <!-- MongoDB -->
    <g transform="translate(0, 0)">
      <rect width="98" height="28" rx="7" fill="#0f172a" stroke="#059669" stroke-opacity="0.3" />
      <path d="M15 10 C13 13, 13 16, 15 18 C17 16, 17 13, 15 10 Z" fill="#34d399" />
      <text x="26" y="18" class="font-mono" font-size="11.5" fill="#6ee7b7">MongoDB</text>
