<svg viewBox="0 0 880 380" width="880" height="380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c101b" />
      <stop offset="100%" stop-color="#080a12" />
    </linearGradient>

    <!-- Name Shimmer Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#38bdf8;#60a5fa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Glow Blobs -->
    <radialGradient id="glowPurple" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #cbd5e1; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }
    @keyframes ripple {
      0% { r: 5px; opacity: 0.8; }
      100% { r: 13px; opacity: 0; }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .ripple-ring { animation: ripple 2s infinite cubic-bezier(0, 0.2, 0.8, 1); transform-origin: 730px 42px; }
  </style>

  <!-- Container Frame -->
  <rect width="880" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="880" height="380" rx="16" fill="url(#grid)" />
  <rect width="880" height="380" rx="16" fill="url(#glowPurple)" />
  <rect width="880" height="380" rx="16" fill="url(#glowCyan)" />
  <rect x="0.5" y="0.5" width="879" height="379" rx="15.5" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- ================= TOP BAR ================= -->
  <!-- Window Dots -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="6" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="16" cy="6" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="32" cy="6" r="4.5" fill="#10b981" fill-opacity="0.75" />
    <text x="52" y="10" class="mono" font-size="12" fill="#64748b" letter-spacing="1">chauhanrajk007.dev</text>
  </g>

  <!-- Availability Pill (Top Right) -->
  <g transform="translate(620, 27)">
    <rect width="224" height="30" rx="15" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.4" />
    <circle cx="20" cy="15" r="4.5" fill="#34d399" class="pulse-dot" />
    <circle cx="20" cy="15" r="5" fill="none" stroke="#34d399" stroke-width="1.5" class="ripple-ring" />
    <text x="34" y="19" class="mono" font-size="11" fill="#6ee7b7" font-weight="500">Available for Opportunities</text>
  </g>

  <!-- ================= HERO SECTION ================= -->
  <!-- Eyebrow -->
  <text x="36" y="106" class="mono" font-size="12" fill="#818cf8" letter-spacing="2" font-weight="600">HELLO WORLD, I'M</text>

  <!-- Name -->
  <text x="36" y="160" class="sans" font-size="52" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Chauhan Raj K</text>

  <!-- Subtitle Tagline -->
  <g transform="translate(36, 192)">
    <text x="0" y="0" class="mono" font-size="16" fill="#f8fafc" font-weight="500">
      <tspan fill="#a855f7">&gt; </tspan>Full-Stack Developer <tspan fill="#475569">|</tspan> AI &amp; ML Enthusiast <tspan fill="#475569">|</tspan> CSE (IoT)
    </text>
  </g>

  <!-- Quick Info / Stat Chips -->
  <g transform="translate(36, 216)">
    <!-- Uni -->
    <rect x="0" y="0" width="228" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="12" y="16" class="mono" font-size="11" fill="#94a3b8">🎓 Presidency Univ · Bengaluru</text>

    <!-- DSA -->
    <rect x="236" y="0" width="194" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="248" y="16" class="mono" font-size="11" fill="#94a3b8">⚡ 90+ DSA (C++ / Java)</text>

    <!-- Hackathon -->
    <rect x="438" y="0" width="170" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="450" y="16" class="mono" font-size="11" fill="#94a3b8">🏆 2x Hackathon Finalist</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="260" x2="844" y2="260" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 4" />

  <!-- ================= TECH STACK CHIPS ================= -->
  <!-- Row 1: Core Technologies -->
  <g transform="translate(36, 278)">
    <g transform="translate(0, 0)">
      <rect width="78" height="26" rx="6" fill="#111625" stroke="#3b82f6" stroke-opacity="0.3"/>
      <text x="39" y="17" text-anchor="middle" class="badge-text" fill="#93c5fd">React</text>
    </g>
    <g transform="translate(86, 0)">
      <rect width="84" height="26" rx="6" fill="#111625" stroke="#22c55e" stroke-opacity="0.3"/>
      <text x="42" y="17" text-anchor="middle" class="badge-text" fill="#86efac">Node.js</text>
    </g>
    <g transform="translate(178, 0)">
      <rect width="82" height="26" rx="6" fill="#111625" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="41" y="17" text-anchor="middle" class="badge-text">Express</text>
    </g>
    <g transform="translate(268, 0)">
      <rect width="86" height="26" rx="6" fill="#111625" stroke="#06b6d4" stroke-opacity="0.3"/>
      <text x="43" y="17" text-anchor="middle" class="badge-text" fill="#67e8f9">Tailwind</text>
    </g>
    <g transform="translate(362, 0)">
      <rect width="92" height="26" rx="6" fill="#111625" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="46" y="17" text-anchor="middle" class="badge-text" fill="#6ee7b7">MongoDB</text>
    </g>
    <g transform="translate(462, 0)">
      <rect width="94" height="26" rx="6" fill="#111625" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="47" y="17" text-anchor="middle" class="badge-text" fill="#a7f3d0">Supabase</text>
    </g>
    <g transform="translate(564, 0)">
      <rect width="80" height="26" rx="6" fill="#111625" stroke="#f59e0b" stroke-opacity="0.3"/>
      <text x="40" y="17" text-anchor="middle" class="badge-text" fill="#fcd34d">Firebase</text>
    </g>
    <g transform="translate(652, 0)">
      <rect width="78" height="26" rx="6" fill="#111625" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="39" y="17" text-anchor="middle" class="badge-text" fill="#7dd3fc">Python</text>
    </g>
    <g transform="translate(738, 0)">
      <rect width="66" height="26" rx="6" fill="#111625" stroke="#6366f1" stroke-opacity="0.3"/>
      <text x="33" y="17" text-anchor="middle" class="badge-text" fill="#a5b4fc">C++</text>
    </g>
  </g>

  <!-- Row 2: Secondary / Specialized Skills -->
  <g transform="translate(36, 312)">
    <g transform="translate(0, 0)">
      <rect width="64" height="26" rx="6" fill="#111625" stroke="#ef4444" stroke-opacity="0.3"/>
      <text x="32" y="17" text-anchor="middle" class="badge-text" fill="#fca5a5">Java</text>
    </g>
    <g transform="translate(72, 0)">
      <rect width="134" height="26" rx="6" fill="#111625" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="67" y="17" text-anchor="middle" class="badge-text" fill="#d8b4fe">RAG Architecture</text>
    </g>
    <g transform="translate(214, 0)">
      <rect width="112" height="26" rx="6" fill="#111625" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="56" y="17" text-anchor="middle" class="badge-text">Git &amp; GitHub</text>
    </g>

    <!-- Links / Socials on the right of Row 2 -->
    <g transform="translate(380, 5)">
      <!-- Portfolio -->
      <circle cx="6" cy="9" r="2.5" fill="#38bdf8" />
      <text x="16" y="13" class="mono" font-size="12" fill="#94a3b8">portfolio: <tspan fill="#38bdf8">chauhanrajk007.github.io/raj-portfolio</tspan></text>
      
      <!-- LinkedIn -->
      <circle cx="340" cy="9" r="2.5" fill="#818cf8" />
      <text x="350" y="13" class="mono" font-size="12" fill="#94a3b8">in: <tspan fill="#818cf8">/in/chauhan-raj-k</tspan></text>
    </g>
  </g>
</svg>
